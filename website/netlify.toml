# Netlify configuration for docs.sierrafy.dev.
#
# This is a second Netlify site on the same repository. In its site settings,
# leave the **base directory at the repository root** and set the **package
# directory** to `website`. Netlify looks for netlify.toml in the package
# directory before the base directory, so that is what makes this file the one it
# reads rather than the root netlify.toml that publishes the landing page.
#
# Paths below are relative to the BASE directory, not to this file, which is why
# `publish` says `website/build`. Base stays at the root so pnpm finds the
# workspace lockfile; Netlify detects the package manager from the base
# directory, and `website/` has no lockfile of its own.
#
# Keeping the docs separate from sierrafy.dev means the landing page deploys with
# no build step, and a failing docs build cannot block it.

# The node_modules wipe is not paranoia. Netlify restores a cached dependency
# tree before the build command runs, and a partially restored pnpm tree fails
# in a way that looks like a dependency bug but is not: `tslib` is a declared
# dependency of `@docusaurus/logger` and is pinned in the lockfile, so when the
# build dies on `Cannot find module 'tslib'`, what is missing is the virtual
# store entry the symlink points at, not the dependency. A `website/node_modules`
# left behind by Netlify's own install in the package directory can shadow the
# workspace tree the same way.
#
# Deploy previews failed 3 times in 7 this way while all 8 branch builds passed
# on the identical lockfile, which is the signature of a per-context cache
# rather than of anything in the repository. `pnpm install` repairs most of it,
# but not reliably enough to debug twice. The pnpm store is cached separately
# and outside the repository, so reinstalling from scratch costs seconds.

[build]
  publish = "website/build"
  command = "rm -rf node_modules website/node_modules packages/*/node_modules && pnpm install --frozen-lockfile && pnpm --filter @sierrafy/website build"

[build.environment]
  # Docusaurus 3 needs 18+; 22 matches the rest of CI.
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Docusaurus fingerprints its assets, so they are safe to cache hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
