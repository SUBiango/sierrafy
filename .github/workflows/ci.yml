name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Node (lint + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version` input on purpose. pnpm/action-setup@v6 errors out when the
      # workflow and package.json both name a version, and `packageManager` in
      # package.json is the better source: it pins an exact patch, so CI and a
      # contributor's machine run the same pnpm.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # Real ID samples are gitignored, but prose *about* them is not — this
      # fails the build if a real NIN is pasted into a doc, test, or comment.
      - name: Sample-PII guard
        run: pnpm run check:pii

      # Type-checks every package. Without this, nothing in CI would: eslint is
      # not type-aware here, and ts-jest only sees test files and what they import.
      - name: Build (type-check)
        run: pnpm run build

      # Coverage, not just pass/fail — jest.config.js enforces the ≥90% validator
      # coverage that the M1 spec requires (specs/001-nin-format-validator §7.6).
      - name: Test
        run: pnpm run test:coverage

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pytest
        run: pip install pytest

      - name: Test
        run: pytest packages/face-engine packages/sdk-python
