name: Release

# Publishing is driven by a tag on `main`, so a release is always something that
# went through the develop -> main PR. See RELEASING.md.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish @sierrafy/sdk
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm provenance (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `version` input on purpose. pnpm/action-setup@v6 errors out when the
      # workflow and package.json both name a version, and `packageManager` in
      # package.json is the better source: it pins an exact patch, so CI and a
      # contributor's machine run the same pnpm.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      # Node 24 (LTS), not 22, on purpose. Trusted publishing needs npm 11.5.1+
      # and staged publishing needs 11.15.0+; Node 22 ships npm 10.9.9, which
      # clears neither. Node 24 ships 11.19.1. Lowering this breaks trusted
      # publishing with an authentication error rather than a version error.
      # CI still tests on 22, and this job re-runs the whole suite on 24.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A tag must not be able to publish something that would fail CI, so every
      # gate runs again here rather than trusting the branch build.
      - name: Lint
        run: pnpm run lint

      - name: Sample-PII guard
        run: pnpm run check:pii

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:coverage

      # Catches the mistake of tagging v0.2.0 while the manifest still says 0.1.0,
      # which would otherwise publish the wrong version under the right tag.
      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/core/package.json').version")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match @sierrafy/sdk version $PKG"
            exit 1
          fi

      # `files` is easy to get wrong in a way that only breaks at runtime, so
      # assert the assets the package cannot work without are actually in it.
      - name: Verify the tarball contents
        working-directory: packages/core
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for f in dist/schema/nin-format.json dist/zone-maps/SL_NATIONAL_EID.json LICENSE dist/nin.js; do
            if ! grep -q " $f\$" /tmp/pack.txt; then
              echo "::error::$f is missing from the tarball"
              exit 1
            fi
            echo "ok $f"
          done
          if grep -q '__tests__' /tmp/pack.txt; then
            echo "::error::tests would be published"
            exit 1
          fi

      # Installs the built tarball into an empty project with no native deps, the
      # way a consumer would. The monorepo layout hides packaging bugs; this does
      # not. See RELEASING.md step 4.
      - name: Smoke-test the tarball as a consumer would
        run: |
          TARBALL="$(cd packages/core && npm pack --silent | tail -1)"
          mkdir -p /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/packages/core/$TARBALL"
          node -e "
            const { validateNin } = require('@sierrafy/sdk/nin');
            const r = validateNin('ABCD1234');
            if (!r.valid) { console.error('validator broken in the published layout'); process.exit(1); }
            const heavy = Object.keys(require.cache).filter(p => /sharp|tesseract/.test(p));
            if (heavy.length) { console.error('subpath pulled in native deps:', heavy); process.exit(1); }
            console.log('validator ok, no native deps loaded');
          "
          node -e "
            require('@sierrafy/sdk').ocr(Buffer.from('x')).then(
              () => { console.error('ocr should not succeed without sharp'); process.exit(1); },
              e => {
                if (!/optional peer dependency/.test(e.message)) {
                  console.error('unhelpful error without sharp:', e.message); process.exit(1);
                }
                console.log('ocr fails with a clear message, as intended');
              });
          "

      # Node version does not guarantee npm version, and the failure mode for a
      # too-old npm is "stage is not a command", which reads like a typo. Fail
      # with the real reason instead.
      - name: Check npm supports staged publishing
        run: |
          NPM_V="$(npm --version)"
          REQ=11.15.0
          echo "npm $NPM_V on node $(node --version)"
          if [ "$(printf '%s\n%s\n' "$REQ" "$NPM_V" | sort -V | head -1)" != "$REQ" ]; then
            echo "::error::npm $NPM_V is older than $REQ, which 'npm stage' requires. Check node-version."
            exit 1
          fi

      # Staged publishing, not a direct publish. CI submits the tarball to a
      # queue; a maintainer approves it with 2FA before it becomes installable.
      #
      # Two reasons this is the publish step rather than `npm publish`:
      # `npm stage publish` needs no 2FA, so NPM_TOKEN does not need the Bypass
      # 2FA setting that npm is deprecating for direct publishing in Jan 2027;
      # and a human with a 2FA device now sits between a compromised pipeline and
      # the registry, which is the gap provenance alone leaves open
      # (docs/development/supply-chain.md).
      #
      # For a package that does not exist yet, npm writes a 0.0.0-stage
      # placeholder and holds the real version until approval.
      - name: Stage the release on npm
        working-directory: packages/core
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Show what is awaiting approval
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm stage list @sierrafy/sdk || true
          echo "::notice::Staged. Approve with: npm stage approve <stage-id>"

      # Draft, because the version is staged rather than published. Publish the
      # release after approving the stage, so GitHub and npm agree.
      - name: Create a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for what changed.

          \`\`\`sh
          npm install @sierrafy/sdk
          \`\`\`

          _This release is a draft because the npm version is staged awaiting
          approval. Run \`npm stage approve <stage-id>\` and then publish this
          release._"
