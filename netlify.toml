# Netlify configuration for sierrafy.dev.
#
# `site/` holds the landing page (hand-built, committed) and `site/docs/`, which
# the Docusaurus build in `website/` writes into and which is gitignored. One
# publish directory serves both, so the docs live at sierrafy.dev/docs/ without
# a redirect or a second site.
#
# Publishing the repository root, which is what this did before the SDK monorepo
# landed, also served packages/, specs/ and docs/ from the public domain.

[build]
  publish = "site"
  command = "pnpm install --frozen-lockfile && pnpm --filter @sierrafy/website build"

[build.environment]
  NODE_VERSION = "22"

# Security headers: sensible defaults for a static identity-project site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Docusaurus fingerprints its assets, so they are safe to cache hard.
[[headers]]
  for = "/docs/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
