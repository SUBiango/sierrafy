# Netlify configuration for the Sierrafy landing page.
#
# The landing page lives in `site/` and that directory alone is published, so a
# deploy carries the site and nothing else. Publishing the repository root, which
# is what this did before the SDK monorepo landed, also served `packages/`,
# `specs/`, and `docs/` from the public domain. None of it is secret, since the
# repository is public, but a deployed site should contain the site.
#
# The page is a single self-contained file with no build step, so there is
# nothing to compile. Netlify still parses the HTML in the publish directory at
# deploy time to register the `notify` form, which keeps working from here.

[build]
  publish = "site"
  command = ""

# Security headers: sensible defaults for a static identity-project site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
