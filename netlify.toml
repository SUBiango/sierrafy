# Netlify configuration for sierrafy.dev, the landing page.
#
# The page is a single self-contained file, so there is nothing to build and
# nothing in the deploy path that could be compromised. The documentation is a
# separate Netlify site at docs.sierrafy.dev, configured in website/netlify.toml,
# so a docs build cannot affect this one.
#
# `site/` alone is published. Publishing the repository root, which is what this
# did before the SDK monorepo landed, also served packages/, specs/ and docs/.

[build]
  publish = "site"
  command = ""

# Security headers: sensible defaults for a static identity-project site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
